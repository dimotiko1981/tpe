<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8F9FF">
<title>Ποντίκι • EVAGELAK EDU LAB</title>
<link rel="stylesheet" href="../assets/style.css?v=20260916j">

<style>
.activity-grid-custom{
  display:grid;
  grid-template-columns:repeat(4,minmax(210px,1fr));
  gap:22px;
  margin-top:24px;
}
.activity-card{
  min-height:260px;
  border-radius:28px;
  background:rgba(255,255,255,.92);
  border:4px solid #ffd34d;
  box-shadow:0 14px 30px rgba(16,59,85,.12);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  padding:20px;
  transition:.18s ease;
}
.activity-card:hover{transform:translateY(-4px)}
.activity-icon{
  width:92px;height:92px;border-radius:50%;
  display:grid;place-items:center;
  font-size:58px;
  background:#fffef4;
  box-shadow:inset 0 0 0 6px rgba(255,211,77,.18),0 8px 18px rgba(16,59,85,.10);
}
.activity-card h3{
  color:#efb900;
  font-size:27px;
  margin:16px 0 10px;
}
.activity-tag{
  background:#f6bd10;
  color:#fff;
  border-radius:12px;
  padding:7px 13px;
  font-weight:900;
}
.mini-progress{
  width:100%;height:8px;border-radius:999px;background:#e5ebef;overflow:hidden;margin-top:auto;
}
.mini-progress span{display:block;width:0;height:100%;background:#75c766}
.activity-meta{margin-top:10px;font-weight:900;color:#4b5967}
@media(max-width:1000px){.activity-grid-custom{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.activity-grid-custom{grid-template-columns:1fr}}
</style>

</head>
<body>
<canvas id="circuitCanvas" aria-hidden="true"></canvas>
<div class="site">

<header class="topbar">
  <a class="logo" href="../index.html" aria-label="Αρχική">
    <img src="../assets/logo.png" alt="EVAGELAK EDU LAB">
  </a>
  <div class="brand">
    <h1>EVAGELAK EDU LAB</h1>
    <div class="motto">Μαθαίνω • Δημιουργώ • Καινοτομώ</div>
  </div>
  <button class="reset-progress-btn" id="resetProgressBtn" type="button" title="Μηδενισμός προόδου">↺ <span>Μηδενισμός</span></button>
  <div class="clock">
    <span class="date" id="liveDate"></span>
    <span class="time" id="liveTime"></span>
  </div>
</header>

<main class="wrap">
  <div class="nav-row"><a class="home-nav-btn" href="../index.html">🏠 Αρχική</a><a class="back" href="../index.html">← Επιστροφή</a></div>
  <section class="intro">
    <div class="intro-icon">🖱️</div>
    <div>
      <h2>Ποντίκι</h2>
      <p>Κίνηση, κλικ, διπλό κλικ, σύρσιμο & απόθεση</p>
      <p id="selectedGrade" style="font-weight:800;color:#F97316;margin-top:8px"></p>
    </div>
  
      <a class="activity-card fish-hunt-card" href="kynigi-psarion/index.html" style="border-color:#35b8d8">
        <div class="activity-icon" style="box-shadow:inset 0 0 0 6px rgba(53,184,216,.18),0 8px 18px rgba(16,59,85,.10)">🐠</div>
        <h3 style="color:#159dc2">Κυνήγι Ψαριών</h3>
        <div class="activity-tag" style="background:#20a9cc">🖱️ Αριστερό κλικ</div>
        <div class="mini-progress"><span style="background:#35b8d8"></span></div>
        <div class="activity-meta">🐠 0 / 15</div>
      </a>

</section>

  <section class="activity-grid-custom">

      <a class="activity-card star-hunt-card" href="kynigi-asterion/index.html">
        <div class="activity-icon">⭐</div>
        <h3>Κυνήγι Αστεριών</h3>
        <div class="activity-tag">🖱️ Κίνηση</div>
        <div class="mini-progress"><span></span></div>
        <div class="activity-meta">⭐ 0 / 15</div>
      </a>

</section>
</main>
<footer class="footer">EVAGELAK EDU LAB • Ποντίκι</footer>
</div>
<script src="../assets/app.js?v=20260916j"></script>
</body>
</html>
