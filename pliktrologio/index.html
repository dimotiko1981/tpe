<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8F9FF">
<title>Πληκτρολόγιο • EVAGELAK EDU LAB</title>
<link rel="stylesheet" href="../assets/style.css?v=20260917i">
<style>
.keyboard-activity-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;margin-top:22px;
}
.keyboard-activity-card{
  display:block;background:rgba(255,255,255,.95);
  border:4px solid #7460da;border-radius:28px;padding:22px;
  box-shadow:0 16px 34px rgba(60,67,116,.14);
  transition:transform .18s ease,box-shadow .18s ease;
}
.keyboard-activity-card:hover{transform:translateY(-5px);box-shadow:0 22px 40px rgba(60,67,116,.20)}
.keyboard-card-icon{
  width:92px;height:92px;border-radius:25px;display:grid;place-items:center;
  margin-bottom:15px;font-size:50px;
  background:linear-gradient(145deg,#f0edff,#d8eaff);
  box-shadow:inset 0 0 0 5px rgba(117,96,218,.11);
}
.keyboard-activity-card h3{margin:0 0 10px;color:#5c48c7;font-size:29px}
.keyboard-tag{
  display:inline-flex;background:#6652ce;color:#fff;border-radius:999px;
  padding:7px 12px;font-weight:900;font-size:14px;
}
.keyboard-card-meta{margin-top:14px;color:#6e7e91;font-weight:800}
.keyboard-mini-progress{height:9px;border-radius:999px;background:#e8e9ef;margin-top:17px;overflow:hidden}
.keyboard-mini-progress span{display:block;width:0;height:100%;background:#7560dc}
</style>
</head>
<body>
<canvas id="circuitCanvas" aria-hidden="true"></canvas>
<div class="site">

<header class="topbar">
  <a class="logo" href="../index.html" aria-label="Αρχική">
    <img src="../assets/logo.png" alt="EVAGELAK EDU LAB">
  </a>
  <div class="brand">
    <h1>EVAGELAK EDU LAB</h1>
    <div class="motto">Μαθαίνω • Δημιουργώ • Καινοτομώ</div>
  </div>
  <button class="reset-progress-btn" id="resetProgressBtn" type="button" title="Μηδενισμός προόδου">↺ <span>Μηδενισμός</span></button>
  <div class="clock">
    <span class="date" id="liveDate"></span>
    <span class="time" id="liveTime"></span>
  </div>
</header>

<main class="wrap">
  <div class="nav-row"><a class="home-nav-btn" href="../index.html">🏠 Αρχική</a><a class="back" href="../index.html">← Επιστροφή</a></div>
  <section class="intro">
    <div class="intro-icon">⌨️</div>
    <div>
      <h2>Πληκτρολόγιο</h2>
      <p>Γράμματα, λέξεις, φράσεις και σωστή χρήση πλήκτρων</p>
      <p id="selectedGrade" style="font-weight:800;color:#4F46E5;margin-top:8px"></p>
    </div>
  </section>

  <section class="keyboard-activity-grid">
    <a class="keyboard-activity-card" href="patise-to-gramma/index.html">
      <div class="keyboard-card-icon">⌨️</div>
      <h3>Πάτησε το Γράμμα</h3>
      <div class="keyboard-tag">⌨️ Εντοπισμός πλήκτρων</div>
      <div class="keyboard-mini-progress"><span></span></div>
      <div class="keyboard-card-meta">15 επίπεδα • Μόνο με πληκτρολόγιο υπολογιστή</div>
    </a>
  </section>
</main>
<footer class="footer">EVAGELAK EDU LAB • Πληκτρολόγιο</footer>
</div>
<script src="../assets/app.js?v=20260917i"></script>
</body>
</html>
